<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zellrechner – Neubauer Kammer</title>

<style>
	:root {
	    --primary: #4a90e2;
	    --primary-dark: #3b7ac4;
	    --bg: #f4f6f9;
	    --card-bg: #ffffff;
	    --radius: 16px;
	}
	
	body {
	    font-family: "Segoe UI", Roboto, sans-serif;
	    background: var(--bg);
	    margin: 0;
	    padding: 20px;
	    display: flex;
	    justify-content: center;
	}
	
	.card {
	    background: var(--card-bg);
	    padding: 25px;
	    border-radius: var(--radius);
	    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
	    width: 100%;
	    max-width: 600px;
	}
	
	h1 {
	    text-align: center;
	    margin-bottom: 20px;
	    color: #333;
	    font-size: clamp(22px, 4vw, 28px);
	}
	
	label {
	    font-weight: 600;
	    margin-top: 15px;
	    display: block;
	    color: #444;
	    font-size: clamp(14px, 3vw, 16px);
	}
	
	input {
	    width: 100%;
	    padding: 12px;
	    margin-top: 6px;
	    border: 1px solid #ccc;
	    border-radius: 10px;
	    font-size: clamp(16px, 3.5vw, 18px);
	    transition: 0.2s;
	}
	
	input:focus {
	    border-color: var(--primary);
	    outline: none;
	    box-shadow: 0 0 4px rgba(74,144,226,0.4);
	}
	
	button {
	    margin-top: 25px;
	    width: 100%;
	    padding: 14px;
	    background: var(--primary);
	    color: white;
	    border: none;
	    border-radius: 10px;
	    font-size: clamp(18px, 4vw, 20px);
	    cursor: pointer;
	    transition: 0.2s;
	}
	
	button:hover {
	    background: var(--primary-dark);
	}
	
	.result {
	    margin-top: 25px;
	    padding: 20px;
	    background: #eef4ff;
	    border-left: 5px solid var(--primary);
	    border-radius: 10px;
	    font-size: clamp(16px, 3.5vw, 18px);
	    line-height: 1.6;
	}
	
	/* Extra mobile spacing */
	@media (max-width: 480px) {
	    .card {
	        padding: 20px;
	    }
	    button {
	        padding: 16px;
	    }
	}
	    
	details {
	margin: 10px 0;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 5px;
	}
	
	/* Äußeres FAQ: kein eigener Margin, nur Padding */
	details.faq-container {
	    margin: 0;
	    padding: 10px;
	}
	
	/* Innere Einträge: konsistenter Abstand */
	details[name="faq"] {
	    margin: 10px 0;
	    padding: 10px;
	    border: 1px solid #ccc;
	    border-radius: 5px;
	}
	
	/* Optional: letzter Eintrag ohne unteren Margin */
	details[name="faq"]:last-of-type {
	    margin-bottom: 0;
	}
	
	summary {
	    cursor: pointer;
	    font-weight: bold;
	}
	
	details[open] {
	    background-color: #f5f5f5;
	}
</style>
</head>

<body>

<div class="card">
	<label id="sprach" for="language">Sprache:</label>
	
	<select id="language">
	    <option value="de">Deutsch</option>
	    <option value="en">English</option>
	    <option value="fr">Français</option>
	    <option value="it">Italiano</option>
	    <option value="pl">Polski</option>
	    <option value="ru">Русский</option>
	    <option value="sk">Slovenčina</option>
	</select>
	
    <h1 id="title">Zellrechner (Neubauer Kammer)</h1>

    <label id="countLabel">Gezählte Zellen (4 Quadrate):</label>
    <input type="number" id="count" value="100">
	
	<label id="radioCellsLabel">
    <input type="radio" name="inputMode" value="zellzahl">
    Zellzahl vorgeben
	</label>
	
	<label id="radioConcLabel">
	    <input type="radio" name="inputMode" value="konz" checked>
	    Zellkonzentration vorgeben
	</label>
	
	<br><br>
	
	<label id="targetCellsLabel" for="targetPerWell">Zielzellen pro Well:</label>
	<input type="number" id="targetPerWell">
	
	<br>
	
	<label id="targetConcLabel" for="targetConcPerWell">
	    Zielzellenkonzentration [Zellen/mm²]:
	</label>
	<input type="number" id="targetConcPerWell">


    <label id="numWellsLabel">Anzahl Wells:</label>
    <input type="number" id="numWells" value="1">

    <button id="calcButton" onclick="calculate()">Berechnen</button>

    <div class="result" id="output">Bitte Werte eingeben und berechnen.</div>
    
    <label id="dishLabel" for="optionen">Optionen Kulturgefäß</label>
	<select id="optionen">
	<option value="1W">1 Well Ibidi µ-Slide</option>
	<option value="2W">2 Well Ibidi µ-Slide</option>
	<option value="3W">3 Well Ibidi µ-Slide</option>
	<option value="8W">8 Well Ibidi µ-Slide</option>
	<option value="18W" selected>18 Well Ibidi µ-Slide</option>
	<option value="32W">32 Well Ibidi µ-Slide</option>
	<option value="circ">Round Well Ibidi µ-Dish</option>
	<option value="microTrichter">Microlinsen Trichter</option>
	<option value="emGrid">EM-Grid</option>
	<option value="indRect">Individual Rechteck</option>
	<option value="indCirc">Individual Kreis</option>
	</select>
	
	<label id="breiteLabel" for="breite">Breite [mm]</label>
	<input type="number" id="breite">
	<div id="laengeContainer">
    <label id="laengeLabel" for="laenge">Länge [mm]</label>
    <input type="number" id="laenge">
	</div>
	<label id="hoeheLabel" for="hoehe">Füllhöhe</label>
	<input type="number" id="hoehe" value="2">
    
    
    <br><br> 

	<div id="faq-container"></div>
	 
</div>

<script src="translations.js"></script>
<script>

/*#########################################
Einbindung der FAQ Skripte / Texte
###########################################*/

const faqFiles = {
    de: "FAQ/faq_german.html",
    en: "FAQ/faq_english.html",
    fr: "FAQ/faq_french.html",
    it: "FAQ/faq_italian.html",
    pl: "FAQ/faq_polish.html",
    ru: "FAQ/faq_russian.html",
    sk: "FAQ/faq_slovak.html"
};

let aktuelleFaqSprache = null; // merken, welche FAQ gerade geladen ist

function loadFAQ(lang) {
    // Wenn dieselbe Sprache schon geladen ist, nichts tun
    if (aktuelleFaqSprache === lang) return;

    const datei = faqFiles[lang];
    if (!datei) return; // unbekannte Sprache – nichts tun

    const container = document.getElementById("faq-container");

    fetch(datei)
        .then(response => {
            if (!response.ok) {
                throw new Error("FAQ konnte nicht geladen werden: " + response.status);
            }
            return response.text();
        })
        .then(html => {
            container.innerHTML = html;
            aktuelleFaqSprache = lang;
        })
        .catch(error => {
            console.error(error);
            container.innerHTML =
                '<p style="color:#DE3848;">FAQ konnte nicht geladen werden.</p>';
        });
}


/*####################################
Sprachübersetzungen
########################################*/

// Sprache aus localStorage laden (Fallback: "de")
let currentLang = "en";
try {
    const gespeichert = localStorage.getItem("sprache");
    if (gespeichert && txt[gespeichert]) {
        currentLang = gespeichert;
    }
} catch (e) {
    // localStorage nicht verfügbar – Fallback bleibt "de"
}

// Übersetzung der UI Elemente

function updateLanguage() {

    const t = txt[currentLang];

	document.getElementById("sprach").textContent =
        t.sprach;
	
    document.getElementById("title").textContent =
        t.title;

    document.getElementById("countLabel").textContent =
        t.count;

    document.getElementById("radioCellsLabel").lastChild.textContent =
        " " + t.radioCells;

    document.getElementById("radioConcLabel").lastChild.textContent =
        " " + t.radioConc;

    document.getElementById("targetCellsLabel").textContent =
        t.targetCells;

    document.getElementById("targetConcLabel").textContent =
        t.targetConc;

    document.getElementById("numWellsLabel").textContent =
        t.numWells;

    document.getElementById("calcButton").textContent =
        t.calcBtn;

    document.getElementById("dishLabel").textContent =
        t.dishLabel;

    document.getElementById("hoeheLabel").textContent =
        t.fillHeight;

    document.getElementById("laengeLabel").textContent =
        t.length;
	
	// Dropdown-Optionen übersetzen
	const optionenSelect = document.getElementById("optionen");
	for (const option of optionenSelect.options) {
	    if (t.dishOptions[option.value]) {
	        option.textContent = t.dishOptions[option.value];
			}
		}
	
	// FAQ nachladen
	loadFAQ(currentLang);
    
    const output = document.getElementById("output");
     
    // Nur den Platzhalter ersetzen,
    // falls noch kein Ergebnis berechnet wurde
    if (
    output.innerHTML === txt.de.outputPlaceholder ||
    output.innerHTML === txt.en.outputPlaceholder ||
    output.innerHTML === txt.sk.outputPlaceholder
    ) {
    output.innerHTML = t.outputPlaceholder;
    }

    updateGeometryUI();
}


/*############################
 
 Dimensions und Flächenberechnungen
 
##############################*/

const dishes = {
	    "1W":  { breite: 48.8, laenge: 21.8 },			// , flaeche: 10.6384
	    "2W":  { breite: 23.8, laenge: 21.6 },			//, flaeche: 5.1408
	    "4W":  { breite: 11.4, laenge: 21.6 },			//, flaeche: 2.4624
	    "8W":  { breite: 10.7, laenge: 9.4 },			//, flaeche: 1.0058
	    "18W": { breite: 6.1,  laenge: 5.7 },			//, flaeche: 0.3477
	    "32W": { breite: 3.5,  laenge: 3.5 },			//, flaeche:  0.1225
	    "circ": { breite: 31, laenge: 31 },				//, flaeche: 7.547
	    "microTrichter": {breite: 1.4, laenge: ""},
	    "emGrid": {breite: 3.05, laenge: ""},
	    "indRect": { breite: "", laenge: "" },			//, flaeche: ""
	    "indCirc": { breite: "", laenge: ""}			//, flaeche: ""
	};

function updateDimensions() {

    const cfg = dishes[optionen.value];

    if (!cfg) return;

    breite.value = cfg.breite;
    laenge.value = cfg.laenge;

    const individual =
        optionen.value === "indRect" ||
        optionen.value === "indCirc";

    breite.disabled = !individual;
    laenge.disabled = !individual;

    updateFlaeche();
}


let flaeche = 0;

function updateFlaeche() {

    const b = parseFloat(breite.value) || 0;
    const l = parseFloat(laenge.value) || 0;

    const isCircle =
        optionen.value === "circ" ||
        optionen.value === "microTrichter" ||
        optionen.value === "indCirc";
    
    const isQubic =
    		optionen.value === "emGrid";

    if (isCircle) {

        const r = b / 2;
        flaeche = Math.PI * r * r;

    } 	else if (isQubic) {
    	
    		const r = b / 2;
    		flaeche = Math.PI * r * r;
    	
    }	else {

        flaeche = b * l;
    }

    flaeche = Number(flaeche.toFixed(4));

    console.log("Fläche:", flaeche);
}



/*############################

Automatisches hin und her rechnen der Konzentration und der Zellzahl

#################################*/


const targetPerWell = document.getElementById("targetPerWell");
const targetConcPerWell = document.getElementById("targetConcPerWell");

const radios = document.querySelectorAll(
    'input[name="inputMode"]'
);


function currentMode() {
    return document.querySelector(
        'input[name="inputMode"]:checked'
    ).value;
}

targetPerWell.addEventListener("input", () => {

    if (currentMode() !== "zellzahl") return;

    const zellzahl = parseFloat(targetPerWell.value);

    if (isNaN(zellzahl) || flaeche <= 0) {
        targetConcPerWell.value = "";
        return;
    }

    targetConcPerWell.value =
        (zellzahl / flaeche).toFixed(2);
});

targetConcPerWell.addEventListener("input", () => {

    if (currentMode() !== "konz") return;

    const konz = parseFloat(targetConcPerWell.value);

    if (isNaN(konz) || flaeche <= 0) {
        targetPerWell.value = "";
        return;
    }

    targetPerWell.value =
        Math.round(konz * flaeche);
});

function updateInputState() {

    const mode = currentMode();

    targetPerWell.disabled = mode !== "zellzahl";
    targetConcPerWell.disabled = mode !== "konz";
}

radios.forEach(r =>
    r.addEventListener("change", updateInputState)
);

/*############################

UX Kram

#################################*/

// Label passen sich der Geometrie an und verstecken dynamisch den Block der Länge

const breiteLabel = document.getElementById("breiteLabel");
const laengeContainer = document.getElementById("laengeContainer");

function updateGeometryUI() {
	
	const t = txt[currentLang];

    const isCircle =
        optionen.value === "circ" ||
        optionen.value === "microTrichter" ||
        optionen.value === "indCirc"||
    		optionen.value === "emGrid";

    if (isCircle) {

        //breiteLabel.textContent = "Durchmesser [mm]";
        breiteLabel.textContent = t.diameter;
        laengeContainer.style.display = "none";

        laenge.value = "";

    } else {

        //breiteLabel.textContent = "Breite [mm]";
        breiteLabel.textContent = t.width;
        laengeContainer.style.display = "block";
    }

    updateFlaeche();
}



/*############################

Event Listener

#################################*/



optionen.addEventListener("change", () => {
	updateDimensions();
	updateGeometryUI();
	});

breite.addEventListener("input", updateFlaeche);
laenge.addEventListener("input", updateFlaeche);




const language = document.getElementById("language");

language.addEventListener("change", () => {

    currentLang = language.value;
	
	try {
	    localStorage.setItem("sprache", currentLang);
	} catch (e) {
	    // ignorieren – Sprache wird dann halt nicht gespeichert
	}

    updateLanguage();
});

/*############################

Schlussendliche Berechnung

#################################*/

function calculate() {
	const t = txt[currentLang];
	
    const count = parseFloat(document.getElementById('count').value);
    const targetPerWell = parseFloat(document.getElementById('targetPerWell').value);
    const numWells = parseFloat(document.getElementById('numWells').value) || 1;
    
    const hoehe = parseFloat(document.getElementById('hoehe').value);

    if (isNaN(count) || count <= 0 || isNaN(targetPerWell) || targetPerWell <= 0) {
        document.getElementById('output').innerHTML = t.invalid; //"Bitte sinnvolle Werte eingeben.";
        return;
    }
    
    const conc = (count / 4) * 1e4;

    const volPerWell_ml = targetPerWell / conc;
    const volPerWell_ul = volPerWell_ml * 1000;

    const totalVol_ml = volPerWell_ml * numWells;
    const totalVol_ul = volPerWell_ul * numWells;
    
    // Berechnungen für die Zielflüssigkeitsmenge bezogen auf Füllhöhe
    // Volumen ist in mm³ -> cm³ entsprechen 1 ml
    const isQubic = optionen.value === "emGrid";
    let gesVol_ml = 0;
    let gesVol_ul = 0;
    
    if (isQubic){
    		const b = parseFloat(breite.value) || 0;
    		const r = b / 2;
    		gesVol_ml = flaeche * r * 4 / 3 / 2 / 1000;
        gesVol_ul = flaeche * r * 4 / 3 / 2;	
    } else {
    		gesVol_ml = flaeche * hoehe / 1000;
        gesVol_ul = flaeche * hoehe;
    }
    
    
    
    console.log("Fläche:", flaeche);
    console.log("Höhe:", hoehe);
    
    const restVol_ml = gesVol_ml - volPerWell_ml;
    const restVol_ul = gesVol_ul - volPerWell_ul;
    
    const totalGesVol_ml = gesVol_ml * numWells;
    const totalGesVol_ul = gesVol_ul * numWells;
    
    const totalRestVol_ml = restVol_ml * numWells;
    const totalRestVol_ul = restVol_ul * numWells;
    
/*
    document.getElementById('output').innerHTML = `
        <b>Konzentration:</b> ${conc.toFixed(2)} Zellen/ml<br>
        <b>Volumen pro Well:</b> ${volPerWell_ul.toFixed(2)} µl (${volPerWell_ml.toFixed(4)} ml)<br>
        <b>Gesamtvolumen für ${numWells} Wells:</b> ${totalVol_ul.toFixed(2)} µl (${totalVol_ml.toFixed(4)} ml)
        <br><br>
        <b> Volumen bezogen auf ${hoehe} mm Flüssigkeitshöhe:</b> <br>
        <br>
        <b>Gesamt-Volumen pro Well:</b> ${gesVol_ul.toFixed(2)} µl (${gesVol_ml.toFixed(4)} ml)<br>
        <b>Zell-Volumen pro Well:</b> ${volPerWell_ul.toFixed(2)} µl (${volPerWell_ml.toFixed(4)} ml)<br>
        <b>Medium-Volumen pro Well (Auffüllen):</b> ${restVol_ul.toFixed(2)} µl (${restVol_ml.toFixed(4)} ml)<br>
        <br>
        <b>Volumina für ${numWells} Wells:<br>
        	<br>
        <b>Gesamt-Volumen:</b> ${totalGesVol_ul.toFixed(2)} µl (${totalGesVol_ml.toFixed(4)} ml)<br>
        <b>Zell-Volumen:</b> ${totalVol_ul.toFixed(2)} µl (${totalVol_ml.toFixed(4)} ml)<br>
        <b>Medium-Volumen (Auffüllen):</b> ${totalRestVol_ul.toFixed(2)} µl (${totalRestVol_ml.toFixed(4)} ml)<br>
        
    `;
    */
    document.getElementById('output').innerHTML = `

    	<b>${t.concentration}:</b>
    	${conc.toFixed(2)} ${t.cellsPerMl}<br>

    	<b>${t.volPerWell}:</b>
    	${volPerWell_ul.toFixed(2)} µl
    	(${volPerWell_ml.toFixed(4)} ml)<br>

    	<b>${t.totalVol} ${numWells} Well(s):</b>
    	${totalVol_ul.toFixed(2)} µl
    	(${totalVol_ml.toFixed(4)} ml)

    	<br><br>

    	<b>${t.volForHeight} ${hoehe} mm:</b>

    	<br><br>

    	<b>${t.totalVolPerWell}:</b>
    	${gesVol_ul.toFixed(2)} µl
    	(${gesVol_ml.toFixed(4)} ml)<br>

    	<b>${t.cellVolPerWell}:</b>
    	${volPerWell_ul.toFixed(2)} µl
    	(${volPerWell_ml.toFixed(4)} ml)<br>

    	<b>${t.mediumVolPerWell}:</b>
    	${restVol_ul.toFixed(2)} µl
    	(${restVol_ml.toFixed(4)} ml)<br>

    	<br>

    	<b>${t.volumesFor} ${numWells} Well(s):</b>

    	<br><br>

    	<b>${t.totalVolume}:</b>
    	${totalGesVol_ul.toFixed(2)} µl
    	(${totalGesVol_ml.toFixed(4)} ml)<br>

    	<b>${t.cellVolume}:</b>
    	${totalVol_ul.toFixed(2)} µl
    	(${totalVol_ml.toFixed(4)} ml)<br>

    	<b>${t.mediumVolume}:</b>
    	${totalRestVol_ul.toFixed(2)} µl
    	(${totalRestVol_ml.toFixed(4)} ml)<br>
    	`;
}


/*#########################
 * Initialisierungen
 ############################*/
 
 updateInputState();
 updateDimensions();
 updateFlaeche();
 // Dropdown auf die gespeicherte Sprache setzen
 language.value = currentLang;
 
 updateLanguage();

</script>

</body>
</html>
